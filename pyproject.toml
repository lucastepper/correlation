[build-system]
requires = ["maturin>=0.12"]
build-backend = "maturin"

[project]
name = "correlation_fft"
description = "FFT-based correlation functions using mkl_fft or implemented in Rust"
readme = "README.md"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Rust"
]
requires-python = ">=3.7"
dependencies = [
    "matplotlib >= 3.1",
    "tqdm >= 4.6",
    "numpy >= 1.15",
    "psutil >= 5.9",
    "h5py >= 3.1",
    "mkl-fft",
    "numba",
    "gle_sim",
]
[project.optional-dependencies]
test = [
  "pytest >= 7",
  "numba >= 0.58",
]
