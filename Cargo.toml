[package]
authors = ["lucastepper <lucas.tepper.91@gmail.com>"]
name = "correlation"
version = "0.1.4"
description = "Compute time correlation functions."
readme = "README.md"
edition = "2021"

[dependencies]
pyo3 = { version = "0.16.5", features = ["extension-module", "abi3-py310"] }
numpy = "0.16.2"
ndarray = { version = "0.15.4", features = ["rayon"] }
crossbeam = "0.8.1"
indicatif = "0.16.2"
# indicatif disables console's default features; enable std on the same version.
console = { version = "0.16.6", features = ["std"] }
num_cpus = "1.13.1"
rayon = "1.5.3"
# cudarc exposes the embedded PTX wrapper through its nvrtc feature.
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12000"] }
ndarray-npy = "0.8.1"
conv = "0.3.3"

[lib]
name = "correlation"
crate-type = ["cdylib"]
